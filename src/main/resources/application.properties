spring.application.name=ecommerce-backend

# H2 Database
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:ecomdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Enable H2 console only in development profile
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security
# PRODUCTION: MUST set JWT_SECRET environment variable (minimum 32 characters)
# DEVELOPMENT: Set JWT_SECRET environment variable or application will fail to start
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
jwt.secret.min.length=32

# Stripe
# PRODUCTION: Set via environment variable: STRIPE_SECRET_KEY=sk_live_...
# PRODUCTION: Set via environment variable: STRIPE_WEBHOOK_SECRET=whsec_...
# WARNING: Never commit real keys to source control.
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# CORS Configuration
# Configure allowed origins for your frontend applications
# Examples: CORS_ALLOWED_ORIGINS=http://localhost:3000,https://yourdomain.com
cors.allowed.origins=http://localhost:3000

# Server
server.port=8080
