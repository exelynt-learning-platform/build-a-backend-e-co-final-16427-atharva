spring.application.name=ecommerce-backend

# H2 Database
spring.datasource.url=jdbc:h2:mem:ecomdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security
# PRODUCTION: Override via environment variable: JWT_SECRET=<your-secret>
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Stripe
# PRODUCTION: Set via environment variable: STRIPE_SECRET_KEY=sk_live_...
# WARNING: Never commit real keys to source control.
stripe.secret.key=${STRIPE_SECRET_KEY:}

# Server
server.port=8080
